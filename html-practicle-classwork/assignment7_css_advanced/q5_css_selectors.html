<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Advanced CSS Selectors Showcase</title>
    <link rel="stylesheet" href="q5_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <h1>Advanced CSS Selectors</h1>

        <form class="sample-form">
            <!-- Attribute Selector Demonstration -->
            <input type="text" placeholder="Type text here..." class="input-field">
            <a href="https://example.com" class="external-link">External HTTPS Link</a>
        </form>

        <ul class="item-list">
            <li>First List Item (nth-child 1)</li>
            <li>Second List Item (nth-child 2)</li>
            <li>Third List Item (nth-child 3)</li>
            <li>Fourth List Item (nth-child 4)</li>
        </ul>

        <div class="parent-box">
            <h2>Parent Header</h2>
            <p>Direct Child Paragraph (> combinator)</p>
            <span class="sibling">Sibling Element</span>
            <p>General Sibling Paragraph (~ combinator)</p>
        </div>
    </main>
</body>
</html>
