<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="q9_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="wrapper">
        <form class="custom-form">
            <h2>Focus &amp; Outline Styling</h2>

            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Focus to see offset outline">
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Focus for colored outline">
            </div>

            <div class="field">
                <label for="notes">Notes</label>
                <textarea id="notes" rows="4" placeholder="Enter notes..."></textarea>
            </div>
        </form>
    </main>
</body>
</html>
