<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 - Shadows and Depth Effect Layout</title>
    <link rel="stylesheet" href="q4_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1 class="depth-title">Shadows &amp; Depth Showcase</h1>
    </header>

    <main class="container">
        <div class="card-row">
            <!-- Card 1: Soft Shadow -->
            <div class="card card-soft">
                <h3>Subtle Elevation</h3>
                <p>Light box-shadow for clean background separation.</p>
            </div>

            <!-- Card 2: Medium Shadow -->
            <div class="card card-medium">
                <h3>Medium Elevation</h3>
                <p>Standard card shadow for interactive components.</p>
            </div>

            <!-- Card 3: Deep Glow Shadow -->
            <div class="card card-deep">
                <h3>Deep Elevation</h3>
                <p>Prominent multi-layered shadow effect.</p>
            </div>
        </div>
    </main>
</body>
</html>
