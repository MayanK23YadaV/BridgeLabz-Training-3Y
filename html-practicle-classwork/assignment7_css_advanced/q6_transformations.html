<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - CSS Transformations Showcase</title>
    <link rel="stylesheet" href="q6_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over boxes to trigger CSS 2D transformations</p>
    </header>

    <main class="container">
        <div class="box-row">
            <div class="box-wrap">
                <div class="box tf-rotate">Rotate</div>
                <p class="label">rotate(15deg)</p>
            </div>

            <div class="box-wrap">
                <div class="box tf-scale">Scale</div>
                <p class="label">scale(1.2)</p>
            </div>

            <div class="box-wrap">
                <div class="box tf-translate">Translate</div>
                <p class="label">translateY(-15px)</p>
            </div>

            <div class="box-wrap">
                <div class="box tf-skew">Skew</div>
                <p class="label">skewX(-15deg)</p>
            </div>
        </div>
    </main>
</body>
</html>
