<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="q3_style.css">
</head>
<body>
  <header>
    <h1>Modern Image Showcase</h1>
    <p>Hover over cards to experience scale effects and overlay transitions.</p>
  </header>

  <main>
    <section class="gallery-grid">
      <!-- Figure 1 -->
      <figure class="showcase-card">
        <div class="img-wrapper">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='400' height='300' fill='%230284c7'/><circle cx='200' cy='150' r='80' fill='%2338bdf8' opacity='0.7'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-size='24'>Alpine Heights</text></svg>" alt="Alpine Heights">
          <div class="overlay"><span>View Details</span></div>
        </div>
        <figcaption>Alpine Heights - High Altitude Peaks</figcaption>
      </figure>

      <!-- Figure 2 -->
      <figure class="showcase-card">
        <div class="img-wrapper">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='400' height='300' fill='%237c3aed'/><polygon points='200,50 350,250 50,250' fill='%23c084fc' opacity='0.7'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-size='24'>Neon Horizon</text></svg>" alt="Neon Horizon">
          <div class="overlay"><span>View Details</span></div>
        </div>
        <figcaption>Neon Horizon - Cyberpunk Sunset</figcaption>
      </figure>

      <!-- Figure 3 -->
      <figure class="showcase-card">
        <div class="img-wrapper">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='400' height='300' fill='%23059669'/><rect x='100' y='75' width='200' height='150' fill='%2334d399' opacity='0.7'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-size='24'>Emerald Forest</text></svg>" alt="Emerald Forest">
          <div class="overlay"><span>View Details</span></div>
        </div>
        <figcaption>Emerald Forest - Dense Woods</figcaption>
      </figure>

      <!-- Figure 4 -->
      <figure class="showcase-card">
        <div class="img-wrapper">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='400' height='300' fill='%23ea580c'/><circle cx='120' cy='100' r='60' fill='%23fb923c' opacity='0.7'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-size='24'>Solar Flare</text></svg>" alt="Solar Flare">
          <div class="overlay"><span>View Details</span></div>
        </div>
        <figcaption>Solar Flare - Warm Energy</figcaption>
      </figure>

      <!-- Figure 5 -->
      <figure class="showcase-card">
        <div class="img-wrapper">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='400' height='300' fill='%23db2777'/><polygon points='200,30 370,270 30,270' fill='%23f472b6' opacity='0.7'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-size='24'>Cosmic Nebula</text></svg>" alt="Cosmic Nebula">
          <div class="overlay"><span>View Details</span></div>
        </div>
        <figcaption>Cosmic Nebula - Deep Space</figcaption>
      </figure>

      <!-- Figure 6 -->
      <figure class="showcase-card">
        <div class="img-wrapper">
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='400' height='300' fill='%23475569'/><rect x='80' y='60' width='240' height='180' rx='20' fill='%2394a3b8' opacity='0.7'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-size='24'>Urban Steel</text></svg>" alt="Urban Steel">
          <div class="overlay"><span>View Details</span></div>
        </div>
        <figcaption>Urban Steel - Architecture</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 BridgeLabz Training - Assignment 8 Question 3</p>
  </footer>
</body>
</html>
