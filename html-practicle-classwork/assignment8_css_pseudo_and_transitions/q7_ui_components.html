<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Interface Components Page</title>
  <link rel="stylesheet" href="q7_style.css">
</head>
<body>
  <header>
    <h1>User Interface Components</h1>
    <p>Card-like flex container with styled search bar, interactive dropdown, and buttons.</p>
  </header>

  <main>
    <div class="ui-card">
      <div class="card-header">
        <h2>Dashboard Search & Filters</h2>
      </div>

      <div class="card-body">
        <!-- Search Bar Component -->
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search components..." class="search-input">
        </div>

        <!-- Dropdown Component -->
        <div class="dropdown-box">
          <select class="custom-select">
            <option value="">Select Category...</option>
            <option value="ui">UI Components</option>
            <option value="css">CSS Utilities</option>
            <option value="js">JS Modules</option>
          </select>
        </div>

        <!-- Action Buttons Component -->
        <div class="button-group">
          <button class="btn btn-search">Search</button>
          <button class="btn btn-reset">Reset</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 BridgeLabz Training - Assignment 8 Question 7</p>
  </footer>
</body>
</html>
