<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="q5_style.css">
</head>
<body>
  <header>
    <h1>Styled Button Collection</h1>
    <p>Demonstrating button variants, state pseudo-classes, and Flexbox alignment.</p>
  </header>

  <main>
    <section class="button-wrapper">
      <!-- Primary Button -->
      <div class="button-card">
        <button class="btn btn-primary">Primary Action</button>
        <span>Primary (.btn-primary)</span>
      </div>

      <!-- Secondary Button -->
      <div class="button-card">
        <button class="btn btn-secondary">Secondary Action</button>
        <span>Secondary (.btn-secondary)</span>
      </div>

      <!-- Outline Button -->
      <div class="button-card">
        <button class="btn btn-outline">Outline Action</button>
        <span>Outline (.btn-outline)</span>
      </div>

      <!-- Disabled Button -->
      <div class="button-card">
        <button class="btn btn-primary" disabled>Disabled Action</button>
        <span>Disabled (:disabled)</span>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 BridgeLabz Training - Assignment 8 Question 5</p>
  </footer>
</body>
</html>
