<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Grid Photo Gallery with Figcaption</title>
    <link rel="stylesheet" href="q8_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Auto-Fit Grid Photo Gallery</h1>
    </header>

    <main class="gallery">
        <figure class="item">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=400&q=80" alt="Yosemite Valley">
            <figcaption>Yosemite National Park</figcaption>
        </figure>

        <figure class="item">
            <img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&w=400&q=80" alt="Mountain Lake">
            <figcaption>Rocky Mountain Lake</figcaption>
        </figure>

        <figure class="item">
            <img src="https://images.unsplash.com/photo-1434394354979-a235cd36269d?auto=format&fit=crop&w=400&q=80" alt="Pine Forest">
            <figcaption>Mist Over Pine Trees</figcaption>
        </figure>

        <figure class="item">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=400&q=80" alt="Green Valley">
            <figcaption>Green Highland Valley</figcaption>
        </figure>
    </main>
</body>
</html>
