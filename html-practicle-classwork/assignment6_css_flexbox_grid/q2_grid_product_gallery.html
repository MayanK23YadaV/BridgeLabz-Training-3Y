<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - 4-Column Product Gallery</title>
    <link rel="stylesheet" href="q2_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Featured Electronics Gallery</h1>
    </header>

    <main class="container">
        <div class="product-grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=300&q=80" alt="Headphones">
                <h3>Wireless Headphones</h3>
                <p class="price">$149.99</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=300&q=80" alt="Smart Watch">
                <h3>Smart Watch Series 7</h3>
                <p class="price">$299.00</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=300&q=80" alt="Smartwatch Sport">
                <h3>Fitness Tracker Pro</h3>
                <p class="price">$89.50</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1585060544812-6b45742d762f?auto=format&fit=crop&w=300&q=80" alt="Smartphone">
                <h3>Flagship Smartphone</h3>
                <p class="price">$899.99</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=300&q=80" alt="Gaming Headset">
                <h3>Surround Gaming Headset</h3>
                <p class="price">$119.00</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=300&q=80" alt="Vintage Camera">
                <h3>Digital Mirrorless Camera</h3>
                <p class="price">$749.00</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?auto=format&fit=crop&w=300&q=80" alt="Wireless Speaker">
                <h3>Bluetooth Speaker</h3>
                <p class="price">$59.99</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=300&q=80" alt="Laptop Keyboard">
                <h3>Mechanical Keyboard</h3>
                <p class="price">$129.99</p>
            </div>
        </div>
    </main>
</body>
</html>
