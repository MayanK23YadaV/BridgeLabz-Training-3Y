<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - 3D Card Flip Animation</title>
    <link rel="stylesheet" href="q9_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="wrapper">
        <div class="flip-card">
            <div class="flip-card-inner">
                <!-- Front side -->
                <div class="flip-card-front">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Developer Profile">
                    <h2>Hover To Flip Card</h2>
                </div>

                <!-- Back side -->
                <div class="flip-card-back">
                    <h2>Software Architect</h2>
                    <p>Building high performance cloud infrastructure and seamless interactive user interfaces.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
