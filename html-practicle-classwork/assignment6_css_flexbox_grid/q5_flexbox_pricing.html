<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Flexbox Pricing Cards</title>
    <link rel="stylesheet" href="q5_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Flexbox Pricing Section</h1>
    </header>

    <main class="container">
        <div class="pricing-container">
            <div class="card">
                <h3>Starter</h3>
                <p class="price">$15/mo</p>
                <p class="desc">Essential tools for individual developers</p>
            </div>

            <!-- Middle Card Highlighted -->
            <div class="card middle-card">
                <span class="badge">Pro Favorite</span>
                <h3>Professional</h3>
                <p class="price">$45/mo</p>
                <p class="desc">Advanced features &amp; priority API access</p>
            </div>

            <div class="card">
                <h3>Enterprise</h3>
                <p class="price">$99/mo</p>
                <p class="desc">Dedicated servers &amp; SLA support</p>
            </div>
        </div>
    </main>
</body>
</html>
