<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio Basics - Bootstrap Utilities</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q2_style.css">
</head>
<body class="bg-dark text-light">

  <main class="container text-center mt-4 mb-3">
    <!-- Main Card Container using bg-light, text-dark, p-5 -->
    <div class="card bg-light text-dark p-5 shadow-lg border-0 rounded-4">
      
      <!-- Header with name and tagline -->
      <header class="mb-4">
        <h1 class="display-4 fw-bold text-dark">Mayank Yadav</h1>
        <p class="lead text-secondary fw-bold">Full Stack Software Developer &amp; Systems Engineer</p>
      </header>

      <!-- Profile image using .img-fluid and .rounded-circle -->
      <div class="mb-4">
        <img class="img-fluid rounded-circle border border-4 border-primary shadow" style="width: 150px; height: 150px; object-fit: cover;" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 150 150'><rect width='150' height='150' fill='%230d6efd'/><circle cx='75' cy='55' r='30' fill='white'/><path d='M25,130 C25,95 125,95 125,130 Z' fill='white'/></svg>" alt="Mayank Yadav Profile">
      </div>

      <!-- Action Buttons: Hire Me & Download CV -->
      <div class="d-flex justify-content-center gap-3 mb-5">
        <button class="btn btn-primary btn-lg fw-bold px-4">Hire Me</button>
        <button class="btn btn-outline-dark btn-lg fw-bold px-4">Download CV</button>
      </div>

      <!-- Small Contact Form using .form-control -->
      <section class="row justify-content-center">
        <div class="col-md-6 text-start">
          <h3 class="fw-bold mb-3 text-center">Get In Touch</h3>
          <form action="#" method="post">
            <div class="mb-3">
              <label for="nameInput" class="form-label fw-bold">Your Name</label>
              <input type="text" class="form-control" id="nameInput" placeholder="Enter your full name">
            </div>
            <div class="mb-3">
              <label for="emailInput" class="form-label fw-bold">Email Address</label>
              <input type="email" class="form-control" id="emailInput" placeholder="name@example.com">
            </div>
            <div class="mb-3">
              <label for="messageInput" class="form-label fw-bold">Message</label>
              <textarea class="form-control" id="messageInput" rows="3" placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100 fw-bold">Send Message</button>
          </form>
        </div>
      </section>

    </div>
  </main>

  <footer class="text-center py-3 text-secondary">
    <p class="mb-0">&copy; 2026 Mayank Yadav Portfolio - Assignment 10 Question 2</p>
  </footer>

</body>
</html>
