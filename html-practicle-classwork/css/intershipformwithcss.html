<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
    <link rel="stylesheet" href="css2.css">
</head>

<body>
    <div class="form-container">
        <header class="form-header">
            <h1>Internship Application Form</h1>
            <p>Fill out the form below to apply for the internship program.</p>
        </header>

        <form action="#" method="POST" enctype="multipart/form-data">
            <fieldset>
                <legend>Personal Details</legend>

                <div class="form-group">
                    <label for="fullname">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="e.g. johndoe@example.com" required>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="phone">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="phone" name="phone" placeholder="e.g. 123-456-7890"
                            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" title="Please enter in 123-456-7890 format" required>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth <span class="required">*</span></label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" placeholder="Enter secure password" required>
                </div>

                <div class="form-group">
                    <label>Gender <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="gender-male" name="gender" value="Male" required>
                            <label for="gender-male">Male</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="gender-female" name="gender" value="Female" required>
                            <label for="gender-female">Female</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="gender-other" name="gender" value="Other" required>
                            <label for="gender-other">Other</label>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Education & Skills</legend>

                <div class="form-group">
                    <label for="course">Course <span class="required">*</span></label>
                    <select id="course" name="course" required>
                        <option value="" disabled selected>Select your course</option>
                        <option value="CSE">CSE (Computer Science)</option>
                        <option value="IT">IT (Information Technology)</option>
                        <option value="ECE">ECE (Electronics & Communication)</option>
                        <option value="Mechanical">Mechanical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Skills <span class="required">*</span> (Select all that apply)</label>
                    <div class="checkbox-group">
                        <div class="checkbox-option">
                            <input type="checkbox" id="skill-java" name="skills" value="Java">
                            <label for="skill-java">Java</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="skill-javascript" name="skills" value="JavaScript">
                            <label for="skill-javascript">JavaScript</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="skill-html" name="skills" value="HTML">
                            <label for="skill-html">HTML</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="skill-css" name="skills" value="CSS">
                            <label for="skill-css">CSS</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="skill-react" name="skills" value="React">
                            <label for="skill-react">React</label>
                        </div>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Internship Preferences & Details</legend>

                <div class="form-group">
                    <label>Internship Preference <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="pref-remote" name="internship_preference" value="Remote" required>
                            <label for="pref-remote">Remote</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="pref-onsite" name="internship_preference" value="On-site" required>
                            <label for="pref-onsite">On-site</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="pref-hybrid" name="internship_preference" value="Hybrid" required>
                            <label for="pref-hybrid">Hybrid</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="resume">Upload Resume <span class="required">*</span></label>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
                    <small class="file-help">Accepted formats: PDF, DOC, DOCX. Max size: 5MB.</small>
                </div>

                <div class="form-group">
                    <label for="coverletter">Cover Letter <span class="required">*</span></label>
                    <textarea id="coverletter" name="coverletter" rows="5"
                        placeholder="Write a brief cover letter describing your motivation..." required></textarea>
                </div>
            </fieldset>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit Application</button>
                <button type="reset" class="btn btn-secondary">Reset Form</button>
            </div>
        </form>
    </div>
</body>

</html>
