<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7 - Secure Login Form with CSRF Token</title>
</head>
<body>
    <header>
        <h1>User Account Login</h1>
    </header>
    <main>
        <form action="#" method="post">
            <!-- 
                CSRF Token Purpose:
                Cross-Site Request Forgery (CSRF) tokens are unique, secret, and unpredictable 
                tokens generated by the server for a user session. Including a hidden CSRF token 
                ensures that form submissions originate strictly from authorized users on the legitimate website, 
                preventing malicious third-party sites from executing unauthorized actions on their behalf.
            -->
            <input type="hidden" name="csrf_token" value="d9a8f7c6b5e43210a987654321fedcba">

            <p>
                <label for="username">Username or Email:</label><br>
                <input type="text" id="username" name="username" required>
            </p>

            <p>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required>
            </p>

            <p>
                <input type="submit" value="Log In">
            </p>
        </form>
    </main>
</body>
</html>
