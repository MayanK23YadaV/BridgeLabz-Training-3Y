<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q15 - Secure Payment Processing Form</title>
</head>
<body>
    <header>
        <h1>Payment Gateway Checkout</h1>
    </header>
    <main>
        <form action="#" method="post">
            <p>
                <label for="cardholder">Cardholder Name:</label><br>
                <input type="text" id="cardholder" name="cardholder" placeholder="Name as printed on card" required>
            </p>

            <p>
                <label for="cardnumber">Card Number:</label><br>
                <input type="text" id="cardnumber" name="cardnumber" placeholder="1234 5678 9101 1121" pattern="[0-9]{16}" required>
            </p>

            <p>
                <label for="expiry">Expiry Date (MM/YY):</label><br>
                <input type="text" id="expiry" name="expiry" placeholder="12/28" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" required>
            </p>

            <p>
                <label for="cvv">CVV Security Code:</label><br>
                <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
            </p>

            <p>
                <input type="submit" value="Pay Now">
            </p>
        </form>
    </main>
</body>
</html>
