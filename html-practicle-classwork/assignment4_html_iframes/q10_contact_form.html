<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q10 - Standard Contact Form</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    <main>
        <form action="#" method="post">
            <p>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
            </p>
            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
            </p>
            <p>
                <label for="subject">Subject:</label><br>
                <input type="text" id="subject" name="subject" placeholder="Inquiry about training program" required>
            </p>
            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your detailed message here..." required></textarea>
            </p>
            <p>
                <input type="submit" value="Send Message">
            </p>
        </form>
    </main>
</body>
</html>
