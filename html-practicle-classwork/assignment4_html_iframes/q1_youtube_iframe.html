<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q1 - Responsive YouTube Iframe</title>
</head>
<body>
    <header>
        <h1>Embedded YouTube Video Demonstration</h1>
    </header>
    <main>
        <p>This video iframe uses percentage values for width and height to automatically adjust when resizing the browser.</p>
        <div style="width: 80%; height: 450px; margin: 0 auto;">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </main>
</body>
</html>
