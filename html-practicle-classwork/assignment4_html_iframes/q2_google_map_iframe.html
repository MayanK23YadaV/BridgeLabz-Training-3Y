<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2 - Google Map Iframe with Lazy Loading</title>
</head>
<body>
    <header>
        <h1>Google Maps Location Embed</h1>
    </header>
    <main>
        <!-- 
            Explanation of loading="lazy":
            The loading="lazy" attribute tells the browser to defer loading off-screen iframe content 
            until the user scrolls near the iframe. This reduces initial page load time, saves network bandwidth, 
            and optimizes memory usage.
        -->
        <h2>School & Campus Location Map</h2>
        <iframe 
            title="Google Map showing School Location" 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3770.785084931326!2d72.88725831490105!3d19.073400987090886!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c880d4407b1d%3A0x8898144b6c31bf07!2sMumbai!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin" 
            width="600" 
            height="400" 
            loading="lazy" 
            style="border:0;" 
            allowfullscreen="">
        </iframe>
    </main>
</body>
</html>
