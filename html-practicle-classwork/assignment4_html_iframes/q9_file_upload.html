<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - Restricted File Upload Form</title>
</head>
<body>
    <header>
        <h1>Profile Picture Upload</h1>
    </header>
    <main>
        <form action="#" method="post" enctype="multipart/form-data">
            <p>
                <label for="profile_image">Select Image File:</label><br>
                <input type="file" id="profile_image" name="profile_image" accept=".jpg,.jpeg,.png" required>
            </p>
            <p>Note: Only image files with <strong>.jpg</strong> or <strong>.png</strong> extensions are permitted for submission.</p>
            <p>
                <input type="submit" value="Upload File">
            </p>
        </form>
    </main>
</body>
</html>
