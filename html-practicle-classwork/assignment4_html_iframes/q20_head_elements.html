<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. <meta charset>: Specifies the character encoding for the HTML document (UTF-8) -->
    <meta charset="UTF-8">

    <!-- 2. <meta description>: Provides a summary of the webpage for search engines (SEO) -->
    <meta name="description" content="A comprehensive demonstration of essential HTML5 head elements and tags.">

    <!-- 3. <meta author>: Demarcates document author information -->
    <meta name="author" content="Mayank Yadav">

    <!-- 4. <meta viewport>: Ensures proper responsive rendering across mobile and desktop devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 5. <title>: Defines the title displayed on the browser tab and search results -->
    <title>Q20 - Complete Head Tag Elements Overview</title>

    <!-- 6. <base>: Sets the base URL for all relative URLs in the document -->
    <base href="https://example.com/" target="_blank">

    <!-- 7. <link>: Specifies relationships between document and external resources (e.g. favicons or stylesheets) -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- 8. <style>: Contains internal CSS rules for styling document elements -->
    <style>
        /* Internal styling can be placed here */
    </style>

    <!-- 9. <script>: Embedded or external JavaScript code execution container -->
    <script>
        // Internal JavaScript code can be executed here
    </script>
</head>
<body>
    <header>
        <h1>HTML &lt;head&gt; Structure Masterclass</h1>
    </header>
    <main>
        <p>Inspect the source code of this document to see detailed comments explaining each of the essential <code>&lt;head&gt;</code> elements.</p>
    </main>
</body>
</html>
