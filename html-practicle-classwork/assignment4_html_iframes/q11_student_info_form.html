<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q11 - Student Information Collection Form</title>
</head>
<body>
    <header>
        <h1>Student Information Form</h1>
    </header>
    <main>
        <form action="#" method="get">
            <p>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Enter student name" required>
            </p>
            <p>
                <label for="rollnumber">Roll Number:</label><br>
                <input type="text" id="rollnumber" name="rollnumber" placeholder="e.g. 2026-CS-101" required>
            </p>
            <p>
                <label for="course">Academic Course:</label><br>
                <select id="course" name="course" required>
                    <option value="" disabled selected>Select Course</option>
                    <option value="cs">Computer Science Engineering</option>
                    <option value="it">Information Technology</option>
                    <option value="ece">Electronics & Communication</option>
                    <option value="me">Mechanical Engineering</option>
                </select>
            </p>
            <p>
                <input type="submit" value="Submit Student Info">
            </p>
        </form>
    </main>
</body>
</html>
