<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q14 - External Website Iframe</title>
</head>
<body>
    <header>
        <h1>Embedding External Website (Wikipedia)</h1>
    </header>
    <main>
        <iframe src="https://www.wikipedia.org" width="100%" height="450" title="Wikipedia External Website"></iframe>
        <p><strong>Security Note:</strong> Some websites may not allow embedding for security reasons (e.g. using the <code>X-Frame-Options</code> or <code>Content-Security-Policy</code> HTTP response headers to prevent clickjacking attacks).</p>
    </main>
</body>
</html>
