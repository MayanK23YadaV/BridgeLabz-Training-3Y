<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q10 - Dropdown Selection Page</title>
</head>
<body>
    <header>
        <h1>Location & Destination Preferences</h1>
    </header>
    <main>
        <form action="#" method="get">
            <p>
                <label for="country">Select Country:</label><br>
                <select id="country" name="country">
                    <option value="india" selected>India</option>
                    <option value="usa">United States</option>
                    <option value="japan">Japan</option>
                    <option value="france">France</option>
                </select>
            </p>

            <p>
                <label for="state">Select State / Region:</label><br>
                <select id="state" name="state">
                    <option value="maharashtra" selected>Maharashtra</option>
                    <option value="california">California</option>
                    <option value="tokyo">Tokyo Prefecture</option>
                    <option value="ile_de_france">Île-de-France</option>
                </select>
            </p>

            <p>
                <label for="city">Select City:</label><br>
                <select id="city" name="city">
                    <option value="mumbai" selected>Mumbai</option>
                    <option value="los_angeles">Los Angeles</option>
                    <option value="tokyo_city">Tokyo</option>
                    <option value="paris">Paris</option>
                </select>
            </p>

            <p>
                <label for="tourist">Favorite Tourist Place:</label><br>
                <select id="tourist" name="tourist">
                    <option value="gateway" selected>Gateway of India</option>
                    <option value="hollywood">Hollywood Sign</option>
                    <option value="skytree">Tokyo Skytree</option>
                    <option value="eiffel">Eiffel Tower</option>
                </select>
            </p>
        </form>

        <h2>Selected Preference Summary</h2>
        <p>
            You have selected <strong>India</strong> as your country, located in the state of <strong>Maharashtra</strong> and city of <strong>Mumbai</strong>. Your chosen favorite tourist destination is the iconic <strong>Gateway of India</strong>.
        </p>
    </main>
</body>
</html>
