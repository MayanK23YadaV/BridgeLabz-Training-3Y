<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - CSS-Only Photo Gallery</title>
    <link rel="stylesheet" href="q6_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Nature &amp; Architecture Gallery</h1>
        <p>Hover over images to reveal captions and zoom effects</p>
    </header>

    <main class="gallery-container">
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=500&q=80" alt="Mountain Landscape">
            <div class="caption">Misty Mountain Peak</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=500&q=80" alt="Forest Pathway">
            <div class="caption">Sunlit Forest Walk</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=500&q=80" alt="Alpine Lake">
            <div class="caption">Crystal Alpine Lake</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=500&q=80" alt="Modern Architecture">
            <div class="caption">Urban Architecture</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80" alt="Tropical Beach">
            <div class="caption">Golden Ocean Sunset</div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=500&q=80" alt="Starry Night Sky">
            <div class="caption">Night Sky Constellations</div>
        </div>
    </main>
</body>
</html>
